<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 반복문: for는 범위(range)로, while은 자바와 동일</title>
  <desc>Kotlin은 C스타일 for가 없고 범위 기반 for-in을 쓴다. until, downTo, step으로 다양하게 순회. while과 do-while은 자바와 같다</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:14.5px;font-weight:700;}
    .m{fill:#78716c;font-size:11.5px;}
    .code{fill:#292524;font-size:12.5px;font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .j{fill:#2563eb;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
  </style>
  <rect x="0" y="0" width="760" height="460" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="350" height="100" rx="10"/>
  <text class="t j" x="38" y="46">Java — C 스타일 for</text>
  <text class="code" x="38" y="76">for (int i=1; i&lt;=5; i++)</text>
  <text class="m" x="38" y="102">i 선언·조건·증가를 직접 관리</text>

  <rect class="box" x="390" y="20" width="350" height="100" rx="10"/>
  <text class="t kt" x="408" y="46">Kotlin — 범위 순회</text>
  <text class="code" x="408" y="76"><tspan class="kt">for</tspan> (i <tspan class="kt">in</tspan> 1..5)</text>
  <text class="m" x="408" y="102">범위를 만들어 그 안을 순회</text>

  <rect class="box" x="20" y="140" width="720" height="170" rx="10"/>
  <text class="t" x="38" y="166">숫자 순회 문법 (범위 만들기)</text>
  <text class="code" x="38" y="198">1<tspan class="kt">..</tspan>5           → 1 2 3 4 5      // 끝 포함</text>
  <text class="code" x="38" y="226">1 <tspan class="kt">until</tspan> 5      → 1 2 3 4        // 끝 제외 (&lt;)</text>
  <text class="code" x="38" y="254">5 <tspan class="kt">downTo</tspan> 1     → 5 4 3 2 1      // 역순</text>
  <text class="code" x="38" y="282">1..10 <tspan class="kt">step</tspan> 2    → 1 3 5 7 9      // 2씩 증가</text>

  <rect class="box" x="20" y="330" width="350" height="120" rx="10"/>
  <text class="t" x="38" y="356">for-each (컬렉션)</text>
  <text class="code" x="38" y="386">Java:   for (n : names)</text>
  <text class="code" x="38" y="410">Kotlin: <tspan class="kt">for</tspan> (n <tspan class="kt">in</tspan> names)</text>
  <text class="m" x="38" y="436">→ 콜론(:) 대신 in</text>

  <rect class="box" x="390" y="330" width="350" height="120" rx="10"/>
  <text class="t" x="408" y="356">while / do-while</text>
  <text class="code" x="408" y="386"><tspan class="kt">while</tspan> (조건) { ... }</text>
  <text class="code" x="408" y="410"><tspan class="kt">do</tspan> { ... } <tspan class="kt">while</tspan> (조건)</text>
  <text class="safe" x="408" y="436">→ 자바와 문법 완전 동일</text>
</svg>

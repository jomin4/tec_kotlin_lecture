<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 if는 표현식: 값을 반환하므로 삼항연산자가 없다</title>
  <desc>Java의 if는 값을 못 남기는 문이라 삼항연산자를 썼지만, Kotlin의 if는 값을 반환하는 표현식이라 삼항연산자가 필요 없다</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:15px;font-weight:700;}
    .m{fill:#78716c;font-size:12px;}
    .code{fill:#292524;font-size:13px;font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .j{fill:#2563eb;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
  </style>
  <rect x="0" y="0" width="760" height="420" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="350" height="90" rx="10"/>
  <text class="t" x="38" y="46">문(Statement)</text>
  <text class="m" x="38" y="70">실행만 하고 값을 안 남김</text>
  <text class="m" x="38" y="92">→ 변수에 담을 수 없음</text>

  <rect class="box" x="390" y="20" width="350" height="90" rx="10"/>
  <text class="t" x="408" y="46">표현식(Expression)</text>
  <text class="m" x="408" y="70">실행하고 값을 반환함</text>
  <text class="m" x="408" y="92">→ 변수에 담을 수 있음</text>

  <rect class="box" x="20" y="130" width="350" height="120" rx="10"/>
  <text class="t j" x="38" y="156">Java: if는 '문'</text>
  <text class="code" x="38" y="184">int max;</text>
  <text class="code" x="38" y="206">if (a > b) max = a;</text>
  <text class="code" x="38" y="228">else max = b;</text>
  <text class="m" x="38" y="246">→ 값이 필요하면 삼항연산자 ? : 별도</text>

  <rect class="box" x="390" y="130" width="350" height="120" rx="10"/>
  <text class="t kt" x="408" y="156">Kotlin: if는 '표현식'</text>
  <text class="code" x="408" y="188"><tspan class="kt">val</tspan> max = <tspan class="kt">if</tspan> (a > b) a <tspan class="kt">else</tspan> b</text>
  <text class="m" x="408" y="214">→ if가 직접 값을 반환</text>
  <text class="m safe" x="408" y="238">→ 삼항연산자 ? : 가 아예 없음 (불필요)</text>

  <rect class="box" x="20" y="270" width="720" height="130" rx="10"/>
  <text class="t" x="38" y="296">블록 { } 을 쓰면 → 마지막 줄이 그 값이 된다</text>
  <text class="code" x="38" y="326"><tspan class="kt">val</tspan> max = <tspan class="kt">if</tspan> (a > b) {</text>
  <text class="code" x="38" y="348">    println("a가 크다")</text>
  <text class="code" x="38" y="370">    a          // ← 이 마지막 값이 max에 담김</text>
  <text class="code" x="38" y="392">} <tspan class="kt">else</tspan> { b }     // 표현식으로 쓸 땐 else 필수!</text>
</svg>

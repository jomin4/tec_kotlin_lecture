<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 data class 자동 생성과 접근 지정자</title>
  <desc>data 키워드 하나로 equals, hashCode, toString, copy, componentN이 자동 생성된다. 접근 지정자는 기본이 public이고 internal(같은 모듈)이 있다</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:14.5px;font-weight:700;}
    .m{fill:#78716c;font-size:11.5px;}
    .code{fill:#292524;font-size:12.5px;font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
  </style>
  <rect x="0" y="0" width="760" height="500" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="720" height="80" rx="10"/>
  <text class="t" x="38" y="46">① data class — 'data' 한 단어로 4가지 자동 생성</text>
  <text class="code" x="38" y="80"><tspan class="kt">data class</tspan> Point(<tspan class="kt">val</tspan> x: Int, <tspan class="kt">val</tspan> y: Int)</text>

  <rect class="box" x="20" y="115" width="350" height="90" rx="10"/>
  <text class="t kt" x="38" y="141">equals() / hashCode()</text>
  <text class="code" x="38" y="168">Point(1,2) == Point(1,2)</text>
  <text class="safe" x="38" y="192">→ true (내용 비교)</text>

  <rect class="box" x="390" y="115" width="350" height="90" rx="10"/>
  <text class="t kt" x="408" y="141">toString()</text>
  <text class="code" x="408" y="168">println(Point(1,2))</text>
  <text class="safe" x="408" y="192">→ Point(x=1, y=2)</text>

  <rect class="box" x="20" y="215" width="350" height="90" rx="10"/>
  <text class="t kt" x="38" y="241">copy()</text>
  <text class="code" x="38" y="268">p.copy(y = 9)</text>
  <text class="m" x="38" y="292">→ 일부만 바꿔 복제 (불변)</text>

  <rect class="box" x="390" y="215" width="350" height="90" rx="10"/>
  <text class="t kt" x="408" y="241">componentN()</text>
  <text class="code" x="408" y="268"><tspan class="kt">val</tspan> (x, y) = point</text>
  <text class="m" x="408" y="292">→ 구조 분해 (한 번에 꺼내기)</text>

  <rect class="box" x="20" y="320" width="720" height="165" rx="10"/>
  <text class="t" x="38" y="346">② 접근 지정자 — 기본이 public! (자바와 다름)</text>
  <text class="code" x="38" y="378"><tspan class="kt">public</tspan>    기본값 (안 쓰면 public) — 자바는 package-private가 기본</text>
  <text class="code" x="38" y="404"><tspan class="kt">private</tspan>   그 클래스/파일 안에서만</text>
  <text class="code" x="38" y="430"><tspan class="kt">protected</tspan> 그 클래스 + 하위 클래스</text>
  <text class="code" x="38" y="456"><tspan class="kt">internal</tspan>  같은 모듈 안에서만 (자바엔 없는 개념)</text>
  <text class="m" x="38" y="478">핵심: 코틀린 기본 public, 자바의 package-private 대신 internal(모듈)</text>
</svg>

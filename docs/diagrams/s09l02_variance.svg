<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 변성: 무공변 기본, out 공변(생산자), in 반공변(소비자), 자바 PECS 대응</title>
  <desc>String<:Any라도 List<String>은 기본 List<Any>의 하위가 아니다(무공변). out=생산자=공변(List<out E>), in=소비자=반공변. 자바 ? extends/? super 대응.</desc>
  <style>
    .title{ font-size:19px; font-weight:700; }
    .sub  { font-size:12.5px; }
    .hdr  { font-size:14px; font-weight:700; }
    .lbl  { font-size:12px; font-weight:600; }
    .mono { font-family: ui-monospace,"Cascadia Code",monospace; font-size:11.5px; }
    .monoS{ font-family: ui-monospace,"Cascadia Code",monospace; font-size:10.5px; }
  </style>

  <rect x="0" y="0" width="760" height="520" fill="#faf9f7"/>

  <text x="30" y="34" class="title" fill="#1a1a1a">변성 = 제네릭 타입 사이의 <tspan fill="#7c5cff">상속 관계</tspan>를 어디로 흘릴까</text>
  <text x="30" y="54" class="sub" fill="#666">String &lt;: Any 라도, List&lt;String&gt;이 List&lt;Any&gt;의 하위인지는 별개 문제</text>

  <!-- invariant / why -->
  <rect x="30" y="72" width="700" height="118" rx="10" fill="#f5f0e8" stroke="#b8722c" stroke-width="1.5"/>
  <text x="46" y="95" class="hdr" fill="#b8722c">무공변(invariant) — 기본값. 왜 막나?</text>
  <text x="46" y="118" class="monoS" fill="#1a1a1a">val strings: MutableList&lt;String&gt; = mutableListOf("a")</text>
  <text x="46" y="137" class="monoS" fill="#c0392b">val anys: MutableList&lt;Any&gt; = strings   // ❌ 만약 허용됐다면…</text>
  <text x="46" y="156" class="monoS" fill="#666">anys.add(42)          // Any 리스트니 Int 추가 OK</text>
  <text x="46" y="175" class="monoS" fill="#c0392b">val s: String = strings[1]   // 💥 String인데 42가 튀어나옴 → 그래서 무공변</text>

  <!-- out -->
  <rect x="30" y="204" width="340" height="150" rx="10" fill="#efeaff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="48" y="227" class="hdr" fill="#7c5cff">out T — 공변 (생산자)</text>
  <text x="48" y="249" class="monoS" fill="#1a1a1a">interface Producer&lt;out T&gt; {</text>
  <text x="48" y="267" class="monoS" fill="#2e9e5b">    fun produce(): T      // 내보내기만 ✅</text>
  <text x="48" y="285" class="monoS" fill="#c0392b">    // fun consume(t: T)  // 받기 ❌</text>
  <text x="48" y="303" class="monoS" fill="#1a1a1a">}</text>
  <text x="48" y="326" class="monoS" fill="#666">넣기 불가 → 참사 불가 → 안전</text>
  <text x="48" y="345" class="lbl" fill="#7c5cff">Producer&lt;String&gt; → Producer&lt;Any&gt; OK</text>

  <!-- in -->
  <rect x="390" y="204" width="340" height="150" rx="10" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="408" y="227" class="hdr" fill="#2e9e5b">in T — 반공변 (소비자)</text>
  <text x="408" y="249" class="monoS" fill="#1a1a1a">interface Consumer&lt;in T&gt; {</text>
  <text x="408" y="267" class="monoS" fill="#2e9e5b">    fun consume(t: T)     // 받기만 ✅</text>
  <text x="408" y="285" class="monoS" fill="#c0392b">    // fun produce(): T   // 반환 ❌</text>
  <text x="408" y="303" class="monoS" fill="#1a1a1a">}</text>
  <text x="408" y="326" class="monoS" fill="#666">Any 다 처리하면 String도 당연히 처리</text>
  <text x="408" y="345" class="lbl" fill="#2e9e5b">Consumer&lt;Any&gt; → Consumer&lt;String&gt; OK</text>

  <!-- PECS table -->
  <rect x="30" y="368" width="700" height="128" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="46" y="391" class="hdr" fill="#1a1a1a">자바 대응 &amp; 암기법 (PECS)</text>

  <text x="60"  y="418" class="lbl" fill="#7c5cff">공변</text>
  <text x="180" y="418" class="mono" fill="#666">out T</text>
  <text x="330" y="418" class="mono" fill="#666">? extends T</text>
  <text x="520" y="418" class="lbl" fill="#666">생산자(Producer·읽기)</text>

  <text x="60"  y="442" class="lbl" fill="#2e9e5b">반공변</text>
  <text x="180" y="442" class="mono" fill="#666">in T</text>
  <text x="330" y="442" class="mono" fill="#666">? super T</text>
  <text x="520" y="442" class="lbl" fill="#666">소비자(Consumer·쓰기)</text>

  <text x="60"  y="466" class="lbl" fill="#b8722c">무공변</text>
  <text x="180" y="466" class="mono" fill="#666">&lt;T&gt;</text>
  <text x="330" y="466" class="mono" fill="#666">&lt;T&gt;</text>
  <text x="520" y="466" class="lbl" fill="#666">읽기+쓰기 (기본)</text>

  <text x="46" y="488" class="monoS" fill="#7c5cff">out=output(내보냄)=생산자 · in=input(받음)=소비자 · 코틀린은 클래스 선언에 한 번만(declaration-site)</text>
</svg>

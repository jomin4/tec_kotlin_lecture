<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 인라인 함수: 람다 객체 오버헤드 제거, reified·non-local return, noinline/crossinline</title>
  <desc>inline은 함수·람다 본문을 호출부에 복사해 람다 객체 생성과 호출 오버헤드를 없앤다. 그래서 reified와 non-local return이 가능. noinline/crossinline으로 조절.</desc>
  <style>
    .title{ font-size:19px; font-weight:700; }
    .sub  { font-size:12px; }
    .hdr  { font-size:14px; font-weight:700; }
    .lbl  { font-size:12px; font-weight:600; }
    .mono { font-family: ui-monospace,"Cascadia Code",monospace; font-size:11.5px; }
    .monoS{ font-family: ui-monospace,"Cascadia Code",monospace; font-size:10.5px; }
  </style>

  <rect x="0" y="0" width="780" height="520" fill="#faf9f7"/>

  <text x="30" y="34" class="title" fill="#1a1a1a">inline = 함수·람다 본문을 <tspan fill="#7c5cff">호출부에 복사</tspan></text>
  <text x="30" y="54" class="sub" fill="#666">람다는 뒤에서 객체(Function1) → 반복 호출 시 할당·호출 오버헤드. inline이 이걸 제거</text>

  <!-- without inline -->
  <rect x="30" y="72" width="360" height="128" rx="10" fill="#f5f0e8" stroke="#b8722c" stroke-width="1.5"/>
  <text x="46" y="95" class="hdr" fill="#b8722c">일반 고차함수 (오버헤드)</text>
  <text x="46" y="118" class="monoS" fill="#1a1a1a">fun measure(block: ()->T)</text>
  <text x="46" y="140" class="monoS" fill="#c0392b">호출마다 람다 → Function 객체 생성</text>
  <text x="46" y="158" class="monoS" fill="#c0392b">+ 그 객체의 invoke() 호출</text>
  <text x="46" y="182" class="monoS" fill="#666">반복문서 수백만 번이면 비용 누적</text>

  <!-- with inline -->
  <rect x="410" y="72" width="340" height="128" rx="10" fill="#efeaff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="426" y="95" class="hdr" fill="#7c5cff">inline 고차함수 (오버헤드 0)</text>
  <text x="426" y="118" class="monoS" fill="#1a1a1a">inline fun measure(block: ()->T)</text>
  <text x="426" y="140" class="monoS" fill="#2e9e5b">본문+람다가 호출부에 복사됨</text>
  <text x="426" y="158" class="monoS" fill="#2e9e5b">→ 객체 생성 X, 호출 X</text>
  <text x="426" y="182" class="monoS" fill="#666">표준 filter/map/forEach/let 다 inline</text>

  <!-- unfold illustration -->
  <rect x="30" y="212" width="720" height="98" rx="10" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="46" y="235" class="hdr" fill="#1a1a1a">컴파일 시 "펼쳐짐"</text>
  <text x="46" y="258" class="mono" fill="#1a1a1a">measure { doWork() }</text>
  <path d="M250 253 L300 253" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="320" y="258" class="monoS" fill="#666">val start=...;  doWork();  val elapsed=...   // 람다 본문이 그대로 박힘</text>
  <text x="46" y="290" class="monoS" fill="#7c5cff">→ 이 "복사" 덕분에 T 자리에 실제 타입이 박혀 reified·non-local return이 가능해진다</text>

  <!-- enables -->
  <rect x="30" y="322" width="360" height="96" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="46" y="345" class="hdr" fill="#7c5cff">inline이 열어주는 것</text>
  <text x="46" y="368" class="monoS" fill="#666">① reified — is T · T::class (소거 우회)</text>
  <text x="46" y="390" class="monoS" fill="#666">② non-local return — 람다 속 return이</text>
  <text x="60" y="406" class="monoS" fill="#666">   바깥 함수를 끝냄 (forEach{return})</text>

  <!-- keywords -->
  <rect x="410" y="322" width="340" height="96" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="426" y="345" class="hdr" fill="#b8722c">조절 키워드</text>
  <text x="426" y="368" class="monoS" fill="#666">noinline — 특정 람다만 inline 제외</text>
  <text x="426" y="384" class="monoS" fill="#666">           (객체로 저장/전달해야 할 때)</text>
  <text x="426" y="404" class="monoS" fill="#666">crossinline — inline하되 non-local</text>
  <text x="440" y="418" class="monoS" fill="#666">   return 금지(다른 맥락에 넘길 때)</text>

  <!-- caution -->
  <rect x="30" y="430" width="720" height="72" rx="10" fill="#efeaff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="46" y="452" class="hdr" fill="#1a1a1a">주의</text>
  <text x="46" y="474" class="monoS" fill="#666">본문이 복사되므로 큰 함수를 inline하면 바이트코드가 커진다 → 작은 고차함수에만 써라.</text>
  <text x="46" y="492" class="monoS" fill="#666">람다 안 받는 일반 함수에 inline은 대개 무의미(경고). inline의 이득은 "람다 오버헤드 제거"에서 온다.</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#888"/>
    </marker>
  </defs>
</svg>

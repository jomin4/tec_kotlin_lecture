<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 지연 초기화: by lazy(처음 접근 시 계산·캐시), lateinit(나중에 대입)</title>
  <desc>lazy는 val 전용, 처음 접근 때 람다 실행 후 캐시, 기본 스레드안전. lateinit은 var 전용 non-null, 외부에서 나중 대입, 접근 전 대입 안 하면 예외.</desc>
  <style>
    .title{ font-size:19px; font-weight:700; }
    .sub  { font-size:12.5px; }
    .hdr  { font-size:14px; font-weight:700; }
    .lbl  { font-size:12px; font-weight:600; }
    .mono { font-family: ui-monospace,"Cascadia Code",monospace; font-size:11.5px; }
    .monoS{ font-family: ui-monospace,"Cascadia Code",monospace; font-size:10.5px; }
  </style>

  <rect x="0" y="0" width="760" height="500" fill="#faf9f7"/>

  <text x="30" y="34" class="title" fill="#1a1a1a">지연 초기화 = 값을 <tspan fill="#7c5cff">"처음 쓸 때"</tspan> 만든다</text>
  <text x="30" y="54" class="sub" fill="#666">비싼 초기화(DB·큰 계산)를 미루고, 안 쓰면 아예 계산 안 함 (자바 수동 lazy getter 대체)</text>

  <!-- lazy -->
  <rect x="30" y="72" width="700" height="150" rx="10" fill="#efeaff" stroke="#7c5cff" stroke-width="1.5"/>
  <text x="46" y="95" class="hdr" fill="#7c5cff">by lazy { } — 내가 계산해서 미룸 (val 전용)</text>
  <text x="46" y="118" class="mono" fill="#1a1a1a">val dbUrl: String by lazy { computeUrl() }</text>

  <rect x="46" y="132" width="150" height="30" rx="5" fill="#fff" stroke="#ccc"/>
  <text x="60" y="152" class="monoS" fill="#666">선언 (계산 X)</text>
  <path d="M200 147 L246 147" stroke="#7c5cff" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="252" y="132" width="200" height="30" rx="5" fill="#fff" stroke="#7c5cff"/>
  <text x="266" y="152" class="monoS" fill="#7c5cff">첫 접근 → 람다 실행·캐시</text>
  <path d="M456 147 L502 147" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="508" y="132" width="200" height="30" rx="5" fill="#fff" stroke="#2e9e5b"/>
  <text x="522" y="152" class="monoS" fill="#2e9e5b">이후 접근 → 캐시값 반환</text>

  <text x="46" y="188" class="lbl" fill="#1a1a1a">특징</text>
  <text x="46" y="208" class="monoS" fill="#666">· 처음 접근 때 딱 한 번 계산  · 기본 스레드 안전(SYNCHRONIZED)  · val 전용</text>

  <!-- lateinit -->
  <rect x="30" y="234" width="700" height="120" rx="10" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="46" y="257" class="hdr" fill="#2e9e5b">lateinit var — 남이 나중에 넣어줌 (var·non-null 전용)</text>
  <text x="46" y="280" class="mono" fill="#1a1a1a">lateinit var repo: UserRepository</text>
  <text x="46" y="302" class="monoS" fill="#c0392b">repo.findAll()   // 💥 대입 전 접근 → UninitializedPropertyAccessException</text>
  <text x="46" y="322" class="monoS" fill="#2e9e5b">repo = MySqlRepository()   // 나중에 대입 → 이후 사용 OK</text>
  <text x="46" y="344" class="monoS" fill="#666">초기화 여부 확인: ::repo.isInitialized  · 주로 DI/프레임워크가 값 주입</text>

  <!-- compare -->
  <rect x="30" y="366" width="700" height="112" rx="10" fill="#fff" stroke="#ccc"/>
  <text x="46" y="389" class="hdr" fill="#1a1a1a">고르는 기준</text>
  <text x="46"  y="414" class="lbl" fill="#7c5cff">by lazy</text>
  <text x="160" y="414" class="monoS" fill="#666">val · 값을 "내가 계산"해서 미룸 · 처음 접근 시 자동</text>
  <text x="46"  y="440" class="lbl" fill="#2e9e5b">lateinit</text>
  <text x="160" y="440" class="monoS" fill="#666">var · non-null · 값을 "남이 대입"할 때까지 미룸 · 접근 전 대입 필수</text>
  <text x="46"  y="466" class="lbl" fill="#7c5cff">한 줄: 내가 계산=lazy · 남이 주입=lateinit</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#888"/>
    </marker>
  </defs>
</svg>

<svg viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Phase 0-1: 빈 생명주기 타임라인 위의 두 훅</title>
  <desc>context.refresh() → ①컨테이너 단계: BeanFactoryPostProcessor(정의 가공, @Component 스캔). ②빈 단계(빈마다): 인스턴스화→주입→BeanPostProcessor.before→init→BeanPostProcessor.after(프록시)→완료.</desc>
  <style>
    .mono{ font-family: ui-monospace,"Cascadia Code",monospace; }
    .src{ font-size:11px; } .h{ font-size:15px; font-weight:700; } .ph{ font-size:10px; font-weight:800; } .b{ font-size:12.5px; font-weight:600; } .s{ font-size:9.5px; } .tag{ font-size:9px; font-weight:800; }
  </style>
  <rect x="0" y="0" width="560" height="500" fill="#faf9f7"/>

  <text x="22" y="22" class="mono src" fill="#888">spring-beans/.../config/BeanPostProcessor.java:67</text>
  <text x="22" y="42" class="h" fill="#1a1a1a">빈 생명주기 위의 두 훅</text>
  <text x="22" y="58" class="s" fill="#888" font-size="10.5">🎯 내 @어노테이션은 어느 단계·확장점에서 처리되나</text>
  <rect x="22" y="68" width="150" height="22" rx="6" fill="#f4f1ec"/><text x="34" y="83" class="mono s" fill="#6d4bff" font-size="11">context.refresh()</text>

  <!-- vertical line -->
  <line x1="40" y1="108" x2="40" y2="440" stroke="#e6e1d8" stroke-width="2"/>

  <text x="22" y="106" class="mono ph" fill="#888">① 컨테이너 단계 (한 번)</text>
  <!-- steps -->
  <circle cx="40" cy="122" r="7" fill="#fff" stroke="#8a8693" stroke-width="3"/>
  <text x="58" y="126" class="b" fill="#1a1a1a">빈 정의 로드</text>

  <circle cx="40" cy="152" r="7.5" fill="#fff" stroke="#6d4bff" stroke-width="3"/><circle cx="40" cy="152" r="11" fill="none" stroke="#efeaff" stroke-width="4"/>
  <text x="58" y="150" class="b" fill="#6d4bff">BeanFactoryPostProcessor</text>
  <rect x="330" y="141" width="70" height="15" rx="7" fill="#efeaff"/><text x="365" y="152" class="mono tag" fill="#6d4bff" text-anchor="middle">확장점 ①</text>
  <text x="58" y="164" class="mono s" fill="#888">@Component 스캔 · @Configuration</text>

  <text x="22" y="196" class="mono ph" fill="#888">② 빈 단계 (빈마다 반복)</text>
  <circle cx="40" cy="212" r="7" fill="#fff" stroke="#8a8693" stroke-width="3"/>
  <text x="58" y="210" class="b" fill="#1a1a1a">인스턴스화</text><text x="58" y="223" class="mono s" fill="#888">생성자</text>

  <circle cx="40" cy="248" r="7" fill="#fff" stroke="#8a8693" stroke-width="3"/>
  <text x="58" y="246" class="b" fill="#1a1a1a">주입</text><text x="58" y="259" class="mono s" fill="#888">@Autowired</text>

  <circle cx="40" cy="286" r="7.5" fill="#fff" stroke="#6d4bff" stroke-width="3"/><circle cx="40" cy="286" r="11" fill="none" stroke="#efeaff" stroke-width="4"/>
  <text x="58" y="290" class="b" fill="#6d4bff">BeanPostProcessor.before</text>
  <rect x="330" y="279" width="70" height="15" rx="7" fill="#efeaff"/><text x="365" y="290" class="mono tag" fill="#6d4bff" text-anchor="middle">확장점 ②</text>

  <circle cx="40" cy="320" r="7" fill="#fff" stroke="#8a8693" stroke-width="3"/>
  <text x="58" y="318" class="b" fill="#1a1a1a">init</text><text x="58" y="331" class="mono s" fill="#888">@PostConstruct</text>

  <circle cx="40" cy="358" r="7.5" fill="#fff" stroke="#6d4bff" stroke-width="3"/><circle cx="40" cy="358" r="11" fill="none" stroke="#efeaff" stroke-width="4"/>
  <text x="58" y="362" class="b" fill="#6d4bff">BeanPostProcessor.after</text>
  <rect x="330" y="351" width="58" height="15" rx="7" fill="#efeaff"/><text x="359" y="362" class="mono tag" fill="#6d4bff" text-anchor="middle">프록시</text>
  <text x="58" y="374" class="mono s" fill="#888">@Transactional</text>

  <circle cx="40" cy="404" r="7" fill="#fff" stroke="#1f8a4c" stroke-width="3"/>
  <text x="58" y="408" class="b" fill="#1f8a4c">사용 준비 완료</text>

  <!-- map -->
  <rect x="22" y="430" width="516" height="58" rx="10" fill="#fff" stroke="#e6e1d8"/>
  <text x="34" y="448" class="mono s" fill="#888" font-weight="700">🔗 @Component→BFPP(①정의) · @Autowired→BPP(②인스턴스) · @Transactional→BPP.after(프록시,②)</text>
  <text x="34" y="470" class="mono s" fill="#1a1a1a" font-size="10.5">질문은 늘: "어느 훅, 어느 단계?" → 타임라인 위 위치로 답</text>
</svg>

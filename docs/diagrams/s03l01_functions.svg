<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 함수: fun 선언, 표현식 함수, default·named 파라미터</title>
  <desc>Kotlin 함수는 fun으로 선언하고 반환 타입이 뒤에 온다. 한 줄이면 = 로 압축, default 파라미터로 오버로딩을 대체, named 파라미터로 가독성을 높인다</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:14.5px;font-weight:700;}
    .m{fill:#78716c;font-size:11.5px;}
    .code{fill:#292524;font-size:12.5px;font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .j{fill:#2563eb;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
  </style>
  <rect x="0" y="0" width="760" height="480" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="720" height="95" rx="10"/>
  <text class="t" x="38" y="46">① 선언: fun, 반환 타입은 뒤(: Int)</text>
  <text class="code" x="38" y="76">Java:   <tspan class="j">int</tspan> add(int a, int b) { return a+b; }     // 타입이 앞</text>
  <text class="code" x="38" y="100">Kotlin: <tspan class="kt">fun</tspan> add(a: Int, b: Int)<tspan class="kt">: Int</tspan> { return a+b }  // 타입이 뒤</text>

  <rect class="box" x="20" y="130" width="720" height="95" rx="10"/>
  <text class="t" x="38" y="156">② 표현식 함수: 한 줄이면 = 로 압축 (return·중괄호 생략)</text>
  <text class="code" x="38" y="186"><tspan class="kt">fun</tspan> add(a: Int, b: Int): Int <tspan class="kt">=</tspan> a + b</text>
  <text class="code" x="38" y="210"><tspan class="kt">fun</tspan> add(a: Int, b: Int) <tspan class="kt">=</tspan> a + b        <tspan class="safe">// 반환 타입도 추론되면 생략</tspan></text>

  <rect class="box" x="20" y="240" width="720" height="120" rx="10"/>
  <text class="t" x="38" y="266">③ default 파라미터 — 오버로딩 지옥 탈출</text>
  <text class="code" x="38" y="296"><tspan class="kt">fun</tspan> greet(name: String, msg: String <tspan class="kt">=</tspan> "안녕", times: Int <tspan class="kt">=</tspan> 1)</text>
  <text class="code" x="38" y="322">greet("철수")            // msg="안녕", times=1 자동</text>
  <text class="code" x="38" y="346">greet("영희", "반가워")   // times=1 자동</text>

  <rect class="box" x="20" y="375" width="720" height="90" rx="10"/>
  <text class="t" x="38" y="401">④ named 파라미터 — 인자에 이름 붙여 호출 (순서 무관, 가독성↑)</text>
  <text class="code" x="38" y="431">greet(name = "철수", times = 3)   // msg는 생략(기본값), 중간만 건너뛰기 가능</text>
  <text class="m" x="38" y="454">→ 자바의 greet("철수", null, 3) 같은 "이 인자 뭐였지?" 문제 해결</text>
</svg>

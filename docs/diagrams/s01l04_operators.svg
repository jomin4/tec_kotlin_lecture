<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 연산자: ==vs===, 비교연산자, 연산자 오버로딩, 중위함수</title>
  <desc>Kotlin의 ==는 내용 비교(Java equals), ===는 참조 비교(Java ==). 비교연산자는 compareTo 자동 호출, operator로 오버로딩, infix 중위함수</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:14.5px;font-weight:700;}
    .m{fill:#78716c;font-size:11.5px;}
    .code{fill:#292524;font-size:12.5px;font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
    .j{fill:#2563eb;font-weight:700;}
  </style>
  <rect x="0" y="0" width="760" height="460" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="720" height="130" rx="10"/>
  <text class="t" x="38" y="46">① == 와 === — 자바와 의미가 뒤바뀐다 (제일 중요!)</text>
  <text class="code" x="38" y="80"><tspan class="kt">==</tspan>  내용(값) 비교   =  Java의 <tspan class="j">.equals()</tspan></text>
  <text class="code" x="400" y="80"><tspan class="kt">===</tspan> 주소(참조) 비교 =  Java의 <tspan class="j">==</tspan></text>
  <text class="code" x="38" y="110">val a = "hi"; val b = "hi"</text>
  <text class="code" x="38" y="132">a <tspan class="kt">==</tspan> b  → <tspan class="safe">true</tspan> (내용 같음)     a <tspan class="kt">===</tspan> b  → 두 객체가 진짜 같은 것이냐</text>

  <rect class="box" x="20" y="170" width="350" height="120" rx="10"/>
  <text class="t" x="38" y="196">② 비교 연산자</text>
  <text class="m" x="38" y="218">Comparable 구현 객체면</text>
  <text class="code" x="38" y="244">Java:   a.compareTo(b) > 0</text>
  <text class="code" x="38" y="268">Kotlin: a > b   // compareTo 자동호출</text>

  <rect class="box" x="390" y="170" width="350" height="120" rx="10"/>
  <text class="t" x="408" y="196">③ 연산자 오버로딩</text>
  <text class="m" x="408" y="218">내 클래스에 + 동작 직접 정의</text>
  <text class="code" x="408" y="244"><tspan class="kt">operator fun</tspan> plus(o: Money)</text>
  <text class="code" x="408" y="268">money1 + money2   // 가능!</text>

  <rect class="box" x="20" y="310" width="720" height="130" rx="10"/>
  <text class="t" x="38" y="336">④ 중위 함수(infix) · 범위(range) · 포함(in)</text>
  <text class="code" x="38" y="368">1<tspan class="kt">..</tspan>10          // 1부터 10까지 범위 (IntRange)</text>
  <text class="code" x="38" y="394">x <tspan class="kt">in</tspan> 1..10     // x가 범위 안에 있나? (true/false)</text>
  <text class="code" x="38" y="420">3 <tspan class="kt">downTo</tspan> 1     // 중위함수 예: a 함수 b 형태로 띄어써서 호출</text>
</svg>

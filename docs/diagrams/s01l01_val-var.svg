<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Java와 Kotlin 변수 선언 비교</title>
  <desc>Java의 final/일반 변수와 Kotlin의 val/var 대응, 타입 추론 설명</desc>
  <style>
    .card { fill: #f5f5f4; stroke: #d6d3d1; stroke-width:1.5; }
    .title { fill: #1c1917; font-size:17px; font-weight:700; }
    .code { fill: #292524; font-size:14px; font-family: ui-monospace, monospace; }
    .muted { fill: #78716c; font-size:12.5px; }
    .kw { fill:#2563eb; font-weight:700; }
    .kt { fill:#7c3aed; font-weight:700; }
    .arrow { stroke: #78716c; stroke-width:2; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#78716c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="380" fill="#faf9f7"/>

  <rect class="card" x="20" y="20" width="300" height="150" rx="10"/>
  <text class="title" x="40" y="50">Java</text>
  <text class="code" x="40" y="85"><tspan class="kw">final</tspan> int number = 10;</text>
  <text class="muted" x="40" y="105">값 변경 불가 (상수처럼)</text>
  <text class="code" x="40" y="135">int count = 1;</text>
  <text class="muted" x="40" y="155">값 변경 가능, 타입 필수</text>

  <rect class="card" x="400" y="20" width="300" height="150" rx="10"/>
  <text class="title" x="420" y="50">Kotlin</text>
  <text class="code" x="420" y="85"><tspan class="kt">val</tspan> number = 10</text>
  <text class="muted" x="420" y="105">재할당 불가, 타입 자동추론</text>
  <text class="code" x="420" y="135"><tspan class="kt">var</tspan> count = 1</text>
  <text class="muted" x="420" y="155">재할당 가능, 세미콜론 없음</text>

  <line class="arrow" x1="325" y1="85" x2="395" y2="85"/>
  <line class="arrow" x1="325" y1="135" x2="395" y2="135"/>

  <rect class="card" x="20" y="200" width="680" height="160" rx="10"/>
  <text class="title" x="40" y="230">핵심 3가지</text>
  <text class="code" x="40" y="262"><tspan class="kt">val</tspan> = value (읽기전용)   ·   <tspan class="kt">var</tspan> = variable (변경가능)</text>
  <text class="muted" x="40" y="288">1. 기본은 val을 쓰고, 꼭 바뀌어야 할 때만 var로 → 안전한 코드</text>
  <text class="muted" x="40" y="312">2. 타입을 안 써도 됨 (타입 추론). 필요하면 val name: String = "..." 처럼 명시</text>
  <text class="muted" x="40" y="336">3. val이라도 컬렉션 '내용'은 변경 가능 — 고정되는 건 '참조'뿐</text>
</svg>

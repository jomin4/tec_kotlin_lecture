<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Kotlin 소스에서 실행까지: .kt → .class → .jar → JVM</title>
  <desc>kotlinc가 kt를 class 바이트코드로 컴파일하고 jar로 묶은 뒤 java가 JVM에서 실행하는 과정</desc>
  <style>
    .box { fill:#f5f5f4; stroke:#d6d3d1; stroke-width:1.5; }
    .t { fill:#1c1917; font-size:15px; font-weight:700; }
    .m { fill:#78716c; font-size:12px; }
    .mono { font-family: ui-monospace, monospace; }
    .step { fill:#7c3aed; font-size:12.5px; font-weight:700; }
    .arrow { stroke:#7c3aed; stroke-width:2.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#faf9f7"/>

  <rect class="box" x="20" y="70" width="150" height="90" rx="10"/>
  <text class="t mono" x="35" y="100">Lesson01.kt</text>
  <text class="m" x="35" y="122">사람이 쓰는</text>
  <text class="m" x="35" y="140">소스 코드 (텍스트)</text>

  <rect class="box" x="300" y="70" width="160" height="90" rx="10"/>
  <text class="t mono" x="315" y="100">Lesson01Kt</text>
  <text class="t mono" x="315" y="118">.class</text>
  <text class="m" x="315" y="140">JVM이 읽는 바이트코드</text>

  <rect class="box" x="590" y="70" width="150" height="90" rx="10"/>
  <text class="t mono" x="605" y="100">out.jar</text>
  <text class="m" x="605" y="122">.class들 + 코틀린</text>
  <text class="m" x="605" y="140">런타임을 zip으로 압축</text>

  <path class="arrow" d="M175,115 L295,115"/>
  <text class="step mono" x="185" y="105">kotlinc</text>
  <text class="m" x="180" y="150">(컴파일)</text>

  <path class="arrow" d="M465,115 L585,115"/>
  <text class="step" x="480" y="105">묶기</text>
  <text class="m" x="470" y="150">-include-runtime</text>

  <rect class="box" x="300" y="250" width="160" height="90" rx="10"/>
  <text class="t" x="315" y="282">실행</text>
  <text class="m mono" x="315" y="304">java -jar out.jar</text>
  <text class="m" x="315" y="326">JVM이 main() 실행</text>
  <path class="arrow" d="M665,160 C665,230 480,230 465,248"/>
  <text class="step" x="540" y="215">java (JVM)</text>

  <rect class="box" x="40" y="250" width="220" height="90" rx="10"/>
  <text class="t" x="55" y="278">MANIFEST.MF</text>
  <text class="m" x="55" y="300">jar 안의 설명서.</text>
  <text class="m" x="55" y="318">"main()은 Lesson01Kt에</text>
  <text class="m" x="55" y="334">있다"고 java에게 알려줌</text>
</svg>

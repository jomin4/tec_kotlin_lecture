<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 null 안정성: String vs String? 와 안전 연산자들</title>
  <desc>non-null 타입과 nullable 타입의 차이, 그리고 안전호출 물음표점, 엘비스, 널아님단언 연산자 설명</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:15px;font-weight:700;}
    .m{fill:#78716c;font-size:12px;}
    .mono{font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
    .danger{fill:#dc2626;font-weight:700;}
    .code{fill:#292524;font-size:13.5px;font-family:ui-monospace,monospace;}
  </style>
  <rect x="0" y="0" width="760" height="470" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="350" height="110" rx="10"/>
  <text class="t mono" x="38" y="50">val name: <tspan class="safe">String</tspan></text>
  <text class="m" x="38" y="72">non-null 타입 — null 절대 불가</text>
  <text class="code" x="38" y="98">name = null  <tspan class="danger">컴파일 에러</tspan></text>
  <text class="m" x="38" y="118">아예 못 넣으니 NPE가 원천 차단</text>

  <rect class="box" x="390" y="20" width="350" height="110" rx="10"/>
  <text class="t mono" x="408" y="50">val name: <tspan class="kt">String?</tspan></text>
  <text class="m" x="408" y="72">nullable 타입 — 물음표로 null 허용</text>
  <text class="code" x="408" y="98">name = null  <tspan class="safe">OK</tspan></text>
  <text class="m" x="408" y="118">대신 쓸 때 반드시 null 처리 강제</text>

  <text class="t" x="20" y="170">null 가능 타입을 다루는 3가지 연산자</text>

  <rect class="box" x="20" y="185" width="230" height="120" rx="10"/>
  <text class="t mono kt" x="38" y="212">?.  안전 호출</text>
  <text class="code" x="38" y="240">name?.length</text>
  <text class="m" x="38" y="262">name이 null이면</text>
  <text class="m" x="38" y="280">실행 안 하고 null 반환</text>
  <text class="m" x="38" y="298">(NPE 대신 조용히 null)</text>

  <rect class="box" x="265" y="185" width="230" height="120" rx="10"/>
  <text class="t mono kt" x="283" y="212">?:  엘비스</text>
  <text class="code" x="283" y="240">name ?: "기본값"</text>
  <text class="m" x="283" y="262">왼쪽이 null이면</text>
  <text class="m" x="283" y="280">오른쪽 값을 대신 사용</text>
  <text class="m" x="283" y="298">(null일 때의 대비책)</text>

  <rect class="box" x="510" y="185" width="230" height="120" rx="10"/>
  <text class="t mono danger" x="528" y="212">!!  널 아님 단언</text>
  <text class="code" x="528" y="240">name!!.length</text>
  <text class="m" x="528" y="262">"절대 null 아니야" 확언</text>
  <text class="m danger" x="528" y="280">null이면 NPE 발생</text>
  <text class="m" x="528" y="298">(꼭 필요할 때만, 최후수단)</text>

  <rect class="box" x="20" y="330" width="720" height="120" rx="10"/>
  <text class="t" x="38" y="360">실무 조합 패턴</text>
  <text class="code" x="38" y="390"><tspan class="kt">val</tspan> length = name?.length ?: 0</text>
  <text class="m" x="380" y="390">name 있으면 길이, null이면 0</text>
  <text class="code" x="38" y="418">name?.let { print(it) }</text>
  <text class="m" x="380" y="418">name이 null 아닐 때만 블록 실행</text>
  <text class="m" x="38" y="440">원칙: ?. 와 ?: 를 기본으로, !! 는 정말 확실할 때만.</text>
</svg>

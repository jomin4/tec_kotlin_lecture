<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>코틀린 확장 함수: 남의 클래스에 함수를 붙인 것처럼 쓴다</title>
  <desc>Java는 유틸 static 메서드로 감싸야 하지만 Kotlin은 fun String.lastChar()처럼 클래스에 직접 붙인 듯 호출한다. 내부적으로는 static 메서드로 컴파일된다</desc>
  <style>
    .box{fill:#f5f5f4;stroke:#d6d3d1;stroke-width:1.5;}
    .t{fill:#1c1917;font-size:14.5px;font-weight:700;}
    .m{fill:#78716c;font-size:11.5px;}
    .code{fill:#292524;font-size:12.5px;font-family:ui-monospace,monospace;}
    .kt{fill:#7c3aed;font-weight:700;}
    .j{fill:#2563eb;font-weight:700;}
    .safe{fill:#16a34a;font-weight:700;}
  </style>
  <rect x="0" y="0" width="760" height="470" fill="#faf9f7"/>

  <rect class="box" x="20" y="20" width="350" height="120" rx="10"/>
  <text class="t j" x="38" y="46">Java — 유틸로 감싼다</text>
  <text class="code" x="38" y="76">StringUtils.lastChar(s)</text>
  <text class="m" x="38" y="102">s가 주인공이 아니라</text>
  <text class="m" x="38" y="122">인자로 끌려감. 장황함.</text>

  <rect class="box" x="390" y="20" width="350" height="120" rx="10"/>
  <text class="t kt" x="408" y="46">Kotlin — 붙여서 쓴다</text>
  <text class="code" x="408" y="76">"코틀린".lastChar()</text>
  <text class="m safe" x="408" y="102">String의 원래 메서드처럼</text>
  <text class="m" x="408" y="122">자연스럽게 호출.</text>

  <rect class="box" x="20" y="155" width="720" height="120" rx="10"/>
  <text class="t" x="38" y="181">문법: fun (붙일클래스).(함수이름) — 그 앞이 '수신 객체 타입'</text>
  <text class="code" x="38" y="214"><tspan class="kt">fun</tspan> <tspan class="j">String</tspan>.lastChar(): Char {</text>
  <text class="code" x="38" y="240">    <tspan class="kt">return</tspan> <tspan class="kt">this</tspan>[this.length - 1]   // this = 나를 호출한 그 String</text>
  <text class="code" x="38" y="266">}</text>

  <rect class="box" x="20" y="290" width="720" height="90" rx="10"/>
  <text class="t" x="38" y="316">원리: 진짜 String을 고치는 게 아니라 → static 메서드로 컴파일</text>
  <text class="code" x="38" y="348">"코틀린".lastChar()   ⟶   StringUtilsKt.lastChar("코틀린")</text>
  <text class="m" x="38" y="370">겉모습만 멤버 함수처럼 예쁘게 보여주는 문법 설탕(syntactic sugar)</text>

  <rect class="box" x="20" y="395" width="720" height="60" rx="10"/>
  <text class="m" x="38" y="420">그래서: ① private 멤버엔 접근 못 함 (진짜 내부가 아님)</text>
  <text class="m" x="38" y="442">        ② 정적으로 결정됨 — 변수의 '선언된 타입' 기준, 오버라이드 안 됨</text>
</svg>
